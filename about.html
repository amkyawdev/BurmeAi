<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Burme Dev Speak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}</style>
</head>
<body class="bg-gradient">
    <div class="floating-particles" id="particles"></div>
    <div class="hamburger-menu" id="hamburgerMenu"><i class="bi bi-list"></i></div>
    <div class="side-nav-overlay" id="sideNavOverlay"></div>
    <div class="side-nav" id="sideNav">
        <a href="index.html" class="side-nav-item"><i class="bi bi-house-fill"></i><span>Home</span></a>
        <a href="chat.html" class="side-nav-item"><i class="bi bi-chat-dots-fill"></i><span>Chat</span></a>
        <a href="speak.html" class="side-nav-item"><i class="bi bi-mic-fill"></i><span>Speak</span></a>
        <a href="docs.html" class="side-nav-item"><i class="bi bi-book-fill"></i><span>Docs</span></a>
        <a href="about.html" class="side-nav-item active"><i class="bi bi-person-fill"></i><span>About</span></a>
    </div>
    <div class="container" style="padding-top:60px;padding-bottom:80px">
        <div class="page-header">
            <i class="bi bi-heart-fill" style="font-size:48px;color:var(--soft-gold);margin-bottom:16px;animation:heartbeat 1s ease-in-out infinite"></i>
            <h1 style="color:var(--soft-gold);margin-bottom:8px">About</h1>
            <p>Burme Dev Speak</p>
        </div>
        <div style="text-align:center;margin-top:24px">
            <p style="color:var(--text-white);font-size:14px;margin-bottom:16px">An AI-powered web application for Burmese text-to-speech and chat.</p>
            <p style="color:var(--text-muted);font-size:13px;margin-bottom:24px">Built with <strong style="color:var(--soft-gold)">Burme Dev</strong></p>
            <div style="display:flex;gap:12px;justify-content:center;margin-top:24px">
                <a href="https://github.com/amkyawdev/BurmeAi" class="btn-outline" target="_blank"><i class="bi bi-github" style="margin-right:6px"></i>GitHub</a>
                <a href="https://huggingface.co/spaces/amkyawdev/BurmeAi-Space-Backend" class="btn-outline" target="_blank"><i class="bi bi-box-seam" style="margin-right:6px"></i>HuggingFace</a>
            </div>
            <div style="margin-top:32px;padding:16px;background:rgba(255,255,255,0.05);border-radius:12px">
                <p style="color:var(--text-muted);font-size:12px"><i class="bi bi-code-slash" style="color:var(--soft-gold);margin-right:6px"></i>Tech: HTML/CSS/JS • FastAPI • HuggingFace</p>
            </div>
        </div>
    </div>
    <script>
document.getElementById('hamburgerMenu').addEventListener('click', function() {
    document.getElementById('sideNav').classList.toggle('open');
    document.getElementById('sideNavOverlay').classList.toggle('open');
});
document.getElementById('sideNavOverlay').addEventListener('click', function() {
    document.getElementById('sideNav').classList.remove('open');
    document.getElementById('sideNavOverlay').classList.remove('open');
});
for (var i = 0; i < 15; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    document.getElementById('particles').appendChild(p);
}
    </script>
</body>
</html>
