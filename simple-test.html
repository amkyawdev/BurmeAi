<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
</head>
<body>
    <h1>Test Page</h1>
    <div id="output">Waiting...</div>
    <button onclick="test()">Click Me</button>
    
    <script>
    document.getElementById('output').innerHTML = 'Page loaded at ' + new Date();
    
    function test() {
        document.getElementById('output').innerHTML = 'Button clicked!';
    }
    </script>
</body>
</html
