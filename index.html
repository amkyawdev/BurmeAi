<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burme Dev Speak App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
</head>
<body class="bg-gradient">
    <div class="floating-particles" id="particles"></div>
    
    <!-- Hamburger Menu -->
    <div class="hamburger-menu" id="hamburgerMenu">
        <i class="bi bi-list"></i>
    </div>
    
    <!-- Side Navigation -->
    <div class="side-nav-overlay" id="sideNavOverlay"></div>
    <div class="side-nav" id="sideNav">
        <a href="index.html" class="side-nav-item active">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>
        <a href="chat.html" class="side-nav-item">
            <i class="bi bi-chat-dots-fill"></i>
            <span>Chat</span>
        </a>
        <a href="speak.html" class="side-nav-item">
            <i class="bi bi-mic-fill"></i>
            <span>Speak</span>
        </a>
        <a href="docs.html" class="side-nav-item">
            <i class="bi bi-book-fill"></i>
            <span>Docs</span>
        </a>
        <a href="about.html" class="side-nav-item">
            <i class="bi bi-person-fill"></i>
            <span>About</span>
        </a>
    </div>
    
    <div class="container" id="mainContainer">
        <i class="bi bi-mic-fill" style="font-size: 56px; color: var(--soft-gold); margin-bottom: 20px;"></i>
        
        <div class="page-header">
            <h1 style="color: var(--soft-gold);">Burme Dev Speak</h1>
            <p>AI-powered Burmese TTS & Chat</p>
        </div>
        
        <button class="btn-gold" id="getStartedBtn">
            <i class="bi bi-rocket-takeoff" style="margin-right: 6px;"></i>
            Get Started
        </button>
        
        <div class="footer" style="position: absolute; bottom: 20px;">
            <p>Powered by AI • Built with ❤️</p>
        </div>
    </div>

    <script>
        // Mobile menu toggle
        const hamburgerMenu = document.getElementById('hamburgerMenu');
        const sideNav = document.getElementById('sideNav');
        const sideNavOverlay = document.getElementById('sideNavOverlay');
        
        function toggleMenu() {
            sideNav.classList.toggle('open');
            sideNavOverlay.classList.toggle('open');
        }
        
        hamburgerMenu.addEventListener('click', toggleMenu);
        sideNavOverlay.addEventListener('click', toggleMenu);
        
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (6 + Math.random() * 4) + 's';
                container.appendChild(particle);
            }
        }
        
        createParticles();
        
        // Handle get started button
        document.getElementById('getStartedBtn').addEventListener('click', function() {
            this.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'chat.html';
            }, 500);
        });
    </script>
</body>
</html>
