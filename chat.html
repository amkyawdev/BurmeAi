<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Burme Dev Speak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-gradient">
    <!-- Floating Particles -->
    <div class="floating-particles" id="particles"></div>
    
    <!-- Hamburger Menu -->
    <button class="hamburger-menu" id="hamburgerBtn"><i class="bi bi-list"></i></button>
    <div class="side-nav-overlay" id="sideNavOverlay"></div>
    <nav class="side-nav" id="sideNav">
        <a href="index.html" class="side-nav-item"><i class="bi bi-house-fill"></i><span>Home</span></a>
        <a href="chat.html" class="side-nav-item active"><i class="bi bi-chat-dots-fill"></i><span>Chat</span></a>
        <a href="speak.html" class="side-nav-item"><i class="bi bi-mic-fill"></i><span>Speak</span></a>
        <a href="docs.html" class="side-nav-item"><i class="bi bi-book-fill"></i><span>Docs</span></a>
        <a href="about.html" class="side-nav-item"><i class="bi bi-person-fill"></i><span>About</span></a>
    </nav>
    
    <!-- Thanking Animation -->
    <div class="thanking-animation" id="thankingAnimation">
        <i class="bi bi-heart-fill"></i>
        <p style="margin-top:12px;color:var(--soft-gold);font-size:14px;">Thank you!</p>
    </div>
    
    <!-- Page Header -->
    <div class="chat-page-header">
        <h1><i class="bi bi-chat-dots-fill"></i> Chat</h1>
    </div>
    
    <!-- Chat Area -->
    <div class="chat-wrapper">
        <div class="chat-messages" id="chatContainer">
            <div class="chat-bubble ai"><i class="bi bi-robot"></i> Hello! I'm your AI assistant. How can I help?</div>
        </div>
    </div>
    
    <!-- Input Area -->
    <div class="chat-input-area">
        <input type="text" class="input-field" id="messageInput" placeholder="Type a message...">
        <button class="btn-gold" id="sendBtn"><i class="bi bi-send-fill"></i></button>
    </div>
    
    <script>
    // Config
    const API_URL = "https://amkyawdev-burmeai-space-backend.hf.space";
    const STORAGE_KEY = "burmeai_chat_history";
    
    // Particles
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 8 + 's';
        document.getElementById('particles').appendChild(p);
    }
    
    // Menu
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sideNav = document.getElementById('sideNav');
    const sideNavOverlay = document.getElementById('sideNavOverlay');
    hamburgerBtn.addEventListener('click', function(e) {
        e.preventDefault();
        sideNav.classList.toggle('open');
        sideNavOverlay.classList.toggle('open');
    });
    sideNavOverlay.addEventListener('click', function() {
        sideNav.classList.remove('open');
        sideNavOverlay.classList.remove('open');
    });
    
    // Chat Elements
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const thankingAnimation = document.getElementById('thankingAnimation');
    
    // Add message
    function addMessage(content, isUser) {
        const bubble = document.createElement('div');
        bubble.className = isUser ? 'chat-bubble user' : 'chat-bubble ai';
        if (isUser) {
            bubble.textContent = content;
        } else {
            bubble.innerHTML = '<i class="bi bi-robot"></i> ' + content;
        }
        chatContainer.appendChild(bubble);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        
        // Save to localStorage
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]';
        history.push({content, isUser, time: Date.now()});
        if (history.length > 50) history = history.slice(-50);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }
    
    // Thanking
    function showThanking() {
        thankingAnimation.classList.add('show');
        setTimeout(() => thankingAnimation.classList.remove('show'), 2000);
    }
    
    // Send
    async function sendMessage() {
        const msg = messageInput.value.trim();
        if (!msg) return;
        messageInput.value = '';
        addMessage(msg, true);
        sendBtn.disabled = true;
        
        try {
            const res = await fetch(API_URL + '/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();
            addMessage(data.response || 'Sorry, I could not get a response.', false);
            showThanking();
        } catch (e) {
            addMessage('Error: ' + e.message, false);
        }
        sendBtn.disabled = false;
    }
    
    // Events
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
    </script>
</body>
</html>
