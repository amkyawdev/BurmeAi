<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Burme Dev Speak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-gradient">
    <div class="floating-particles" id="particles"></div>
    
    <!-- Hamburger Menu Button -->
    <button class="hamburger-menu" id="hamburgerBtn">
        <i class="bi bi-list"></i>
    </button>
    
    <!-- Side Nav Overlay -->
    <div class="side-nav-overlay" id="sideNavOverlay"></div>
    
    <!-- Side Navigation -->
    <nav class="side-nav" id="sideNav">
        <a href="index.html" class="side-nav-item"><i class="bi bi-house-fill"></i><span>Home</span></a>
        <a href="chat.html" class="side-nav-item active"><i class="bi bi-chat-dots-fill"></i><span>Chat</span></a>
        <a href="speak.html" class="side-nav-item"><i class="bi bi-mic-fill"></i><span>Speak</span></a>
        <a href="docs.html" class="side-nav-item"><i class="bi bi-book-fill"></i><span>Docs</span></a>
        <a href="about.html" class="side-nav-item"><i class="bi bi-person-fill"></i><span>About</span></a>
    </nav>
    
    <div class="thanking-animation" id="thankingAnimation">
        <i class="bi bi-heart-fill"></i>
        <p style="margin-top:12px;color:var(--soft-gold);font-size:14px;">Thank you!</p>
    </div>
    
    <div class="container" style="padding-top:60px;padding-bottom:80px;">
        <div class="page-header"><h1 style="color:var(--soft-gold);"><i class="bi bi-chat-dots-fill"></i></h1><p>Chat with AI</p></div>
        
        <!-- Chat History -->
        <div class="chat-container" id="chatContainer"></div>
        
        <!-- Input Area -->
        <div class="input-area">
            <input type="text" class="input-field" id="messageInput" placeholder="Type a message...">
            <button class="btn-gold" id="sendBtn">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>
    
    <script>
    // Configuration
    const API_URL = "https://amkyawdev-burmeai-space-backend.hf.space";
    const STORAGE_KEY = "burmeai_chat_history";
    
    // DOM Elements
    const hamburgerBtn = document.getElementById("hamburgerBtn");
    const sideNav = document.getElementById("sideNav");
    const sideNavOverlay = document.getElementById("sideNavOverlay");
    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const thankingAnimation = document.getElementById("thankingAnimation");
    
    // Create particles
    for (let i = 0; i < 15; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 8 + "s";
        document.getElementById("particles").appendChild(p);
    }
    
    // Hamburger Menu Toggle
    hamburgerBtn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        sideNav.classList.toggle("open");
        sideNavOverlay.classList.toggle("open");
    });
    
    // Close menu when clicking overlay
    sideNavOverlay.addEventListener("click", function() {
        sideNav.classList.remove("open");
        sideNavOverlay.classList.remove("open");
    });
    
    // Load Chat History from localStorage
    function loadChatHistory() {
        const history = localStorage.getItem(STORAGE_KEY);
        if (history) {
            const messages = JSON.parse(history);
            messages.forEach(msg => {
                addMessage(msg.content, msg.isUser, false);
            });
        } else {
            // Default welcome message
            addMessage("Hello! I'm your AI assistant. How can I help?", false, false);
        }
    }
    
    // Save Chat History to localStorage
    function saveChatHistory(content, isUser) {
        let history = [];
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            history = JSON.parse(stored);
        }
        history.push({ content: content, isUser: isUser, timestamp: Date.now() });
        // Keep only last 50 messages
        if (history.length > 50) {
            history = history.slice(-50);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }
    
    // Add message to chat
    function addMessage(content, isUser, save = true) {
        const bubble = document.createElement("div");
        bubble.className = isUser ? "chat-bubble user" : "chat-bubble ai";
        if (isUser) {
            bubble.textContent = content;
        } else {
            bubble.innerHTML = '<i class="bi bi-robot"></i> ' + content;
        }
        chatContainer.appendChild(bubble);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        
        if (save) {
            saveChatHistory(content, isUser);
        }
    }
    
    // Show thanking animation
    function showThanking() {
        thankingAnimation.classList.add("show");
        setTimeout(() => thankingAnimation.classList.remove("show"), 2000);
    }
    
    // Send message
    async function sendMessage() {
        const msg = messageInput.value.trim();
        if (!msg) return;
        
        messageInput.value = "";
        addMessage(msg, true);
        sendBtn.disabled = true;
        
        try {
            const res = await fetch(API_URL + "/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            addMessage(data.response || "Sorry, I could not get a response.", false);
            showThanking();
        } catch (e) {
            addMessage("Sorry, something went wrong. Please try again.", false);
        }
        
        sendBtn.disabled = false;
    }
    
    // Event Listeners
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Load history on page load
    loadChatHistory();
    </script>
</body>
</html>
