<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak - Burme Dev Speak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-gradient">
    <div class="floating-particles" id="particles"></div>
    
    <!-- Hamburger Menu Button -->
    <button class="hamburger-menu" id="hamburgerBtn" onclick="toggleMenu()">
        <i class="bi bi-list"></i>
    </button>
    
    <!-- Side Nav Overlay -->
    <div class="side-nav-overlay" id="sideNavOverlay" onclick="closeMenu()"></div>
    
    <!-- Side Navigation -->
    <nav class="side-nav" id="sideNav">
        <a href="index.html" class="side-nav-item"><i class="bi bi-house-fill"></i><span>Home</span></a>
        <a href="chat.html" class="side-nav-item"><i class="bi bi-chat-dots-fill"></i><span>Chat</span></a>
        <a href="speak.html" class="side-nav-item active"><i class="bi bi-mic-fill"></i><span>Speak</span></a>
        <a href="docs.html" class="side-nav-item"><i class="bi bi-book-fill"></i><span>Docs</span></a>
        <a href="about.html" class="side-nav-item"><i class="bi bi-person-fill"></i><span>About</span></a>
    </nav>
    
    <div class="container" style="padding-top:60px;padding-bottom:80px;">
        <div class="page-header">
            <h1 style="color:var(--soft-gold);"><i class="bi bi-mic-fill"></i></h1>
            <p>Text to Speech</p>
        </div>
        
        <textarea class="input-field" id="textInput" placeholder="Enter Burmese text to speak..."></textarea>
        
        <button class="btn-gold mt-2" id="speakBtn" onclick="generateSpeech()" style="width:100%;">
            <i class="bi bi-play-fill" id="speakIcon"></i>
            <span id="speakText">Speak</span>
        </button>
        
        <div class="waveform-container hidden" id="waveform">
            <div class="waveform-bars">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <p class="waveform-text">Generating audio...</p>
        </div>
        
        <div class="audio-player hidden" id="audioPlayer">
            <audio id="audio" controls></audio>
            <button class="btn-outline mt-2" id="downloadBtn" style="width:100%;">
                <i class="bi bi-download"></i> Download
            </button>
        </div>
    </div>
    
    <script>
    const API_URL = "https://amkyawdev-burmeai-space-backend.hf.space";
    
    // Menu functions
    function toggleMenu() {
        document.getElementById("sideNav").classList.toggle("open");
        document.getElementById("sideNavOverlay").classList.toggle("open");
    }
    function closeMenu() {
        document.getElementById("sideNav").classList.remove("open");
        document.getElementById("sideNavOverlay").classList.remove("open");
    }
    
    // Create particles
    for (let i = 0; i < 15; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 8 + "s";
        document.getElementById("particles").appendChild(p);
    }
    
    // Elements
    const textInput = document.getElementById("textInput");
    const speakBtn = document.getElementById("speakBtn");
    const speakIcon = document.getElementById("speakIcon");
    const waveform = document.getElementById("waveform");
    const audioPlayer = document.getElementById("audioPlayer");
    const audio = document.getElementById("audio");
    const downloadBtn = document.getElementById("downloadBtn");
    
    async function generateSpeech() {
        const text = textInput.value.trim();
        if (!text) {
            alert("Please enter some text");
            return;
        }
        
        speakBtn.disabled = true;
        waveform.classList.remove("hidden");
        audioPlayer.classList.add("hidden");
        
        try {
            const res = await fetch(API_URL + "/api/speak", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });
            
            const data = await res.json();
            
            if (data.audio) {
                audio.src = data.audio;
                audioPlayer.classList.remove("hidden");
                audio.play();
            } else {
                alert("Could not generate audio. Please try again.");
            }
        } catch (e) {
            alert("Error: " + e.message);
        }
        
        speakBtn.disabled = false;
        waveform.classList.add("hidden");
    }
    
    downloadBtn.addEventListener("click", function() {
        const a = document.createElement("a");
        a.href = audio.src;
        a.download = "burmese-speech.wav";
        a.click();
    });
    </script>
</body>
</html>
