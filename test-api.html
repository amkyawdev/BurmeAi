<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #1a1a2e; color: white; }
        .btn-gold { background: #ffd700; color: #000; border: none; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Test Chat API</h1>
    <input type="text" id="msg" class="form-control mb-2" placeholder="Type message...">
    <button onclick="send()" class="btn-gold">Send</button>
    <div id="response" class="mt-3"></div>

    <script>
    const API_URL = "https://amkyawdev-burmeai-space-backend.hf.space";
    
    async function send() {
        const m = document.getElementById('msg').value;
        document.getElementById('response').innerHTML = "Sending...";
        
        try {
            const r = await fetch(API_URL + '/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: m, history: []})
            });
            const d = await r.json();
            document.getElementById('response').innerHTML = "<pre>" + JSON.stringify(d, null, 2) + "</pre>";
        } catch(e) {
            document.getElementById('response').innerHTML = "Error: " + e.message;
        }
    }
    </script>
</body>
</html>
